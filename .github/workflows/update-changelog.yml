name: Update Changelog

on:
  workflow_call:
    secrets:
      release_app_private_key:
        required: true

permissions:
  contents: read

jobs:
  update:
    if: github.event_name == 'release' && !github.event.release.prerelease && !contains(github.event.release.tag_name, '-')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Create release bot token
        id: release-bot
        uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349 # v2
        with:
          app-id: ${{ vars.LETTERMINT_RELEASE_APP_ID }}
          private-key: ${{ secrets.release_app_private_key }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-contents: write

      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.repository.default_branch }}
          token: ${{ steps.release-bot.outputs.token }}

      - name: Update changelog from release notes
        uses: stefanzweifel/changelog-updater-action@a938690fad7edf25368f37e43a1ed1b34303eb36 # v1
        with:
          latest-version: ${{ github.event.release.tag_name }}
          release-notes: ${{ github.event.release.body }}

      - name: Verify changed paths
        shell: bash
        run: |
          test -f CHANGELOG.md
          test ! -L CHANGELOG.md

          mapfile -t changed_paths < <(git status --porcelain=v1 --untracked-files=all | cut -c4-)
          for path in "${changed_paths[@]}"; do
            if [[ "$path" != "CHANGELOG.md" ]]; then
              echo "Unexpected changed path: $path" >&2
              exit 1
            fi
          done

      - name: Commit updated changelog
        shell: bash
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          GH_TOKEN: ${{ steps.release-bot.outputs.token }}
          RELEASE_BOT_SLUG: ${{ steps.release-bot.outputs.app-slug }}
        run: |
          if git diff --quiet -- CHANGELOG.md; then
            echo "CHANGELOG.md is already current."
            exit 0
          fi

          bot_login="${RELEASE_BOT_SLUG}[bot]"
          bot_id=$(gh api "users/${bot_login}" --jq .id)
          git config user.name "$bot_login"
          git config user.email "${bot_id}+${bot_login}@users.noreply.github.com"
          git add -- CHANGELOG.md
          git commit -m "Update CHANGELOG"
          git push origin "HEAD:${DEFAULT_BRANCH}"
